<title>臺大電信所丙組</title>
<meta name="description" content="臺大電信所丙組（資料科學與智慧網路）：組別介紹、修課與研究準備、學長姐 Q&amp;A。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
/* Layout: plain white page, system fonts (PingFang / SF on Apple, Noto Sans TC elsewhere), one content column, large type. */
:root{
  --bg:#FFFFFF;
  --bg-2:#F5F5F7;
  --fg:#1D1D1F;
  --fg-2:#6E6E73;
  --line:#D2D2D7;
  --accent:#0066CC;
  --warn:#B64400;
  --btn:#0066CC;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","PingFang TC","Noto Sans TC","Microsoft JhengHei",Roboto,"Segoe UI",Arial,sans-serif;
  --gut:clamp(20px,5vw,48px);
  --col:1040px;
  --read:760px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--bg-2:#1C1C1E;--fg:#F5F5F7;--fg-2:#A1A1A6;--line:#3A3A3C;--accent:#2997FF;--warn:#FF9F0A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--bg-2:#1C1C1E;--fg:#F5F5F7;--fg-2:#A1A1A6;--line:#3A3A3C;--accent:#2997FF;--warn:#FF9F0A;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 20px/1.7 var(--f);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:color-mix(in srgb,var(--accent) 25%,transparent)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:.2em}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--col);margin:0 auto;padding-inline:var(--gut)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.005em}
p{margin:0}
.en-on .zh-only,.zh-on .en-only{display:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:28px;min-height:60px}
.brand{font-weight:600;font-size:19px;color:var(--fg);white-space:nowrap;margin-right:auto}
.brand:hover{text-decoration:none}
.tabs{display:flex;gap:28px}
.tab{font-size:17px;color:var(--fg-2);padding:18px 0 16px;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--fg);text-decoration:none}
.tab[aria-current="page"]{color:var(--fg);font-weight:600;border-bottom-color:var(--fg)}
.lang{display:flex;gap:2px;background:var(--bg-2);border-radius:999px;padding:3px}
.lang button{font:500 15px/1 var(--f);color:var(--fg-2);background:none;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:34px}
.lang button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- hero ---------- */
.head{padding-block:clamp(56px,9vw,112px) clamp(40px,6vw,72px)}
.head h1{font-size:clamp(46px,7.4vw,84px);line-height:1.1;word-break:keep-all}
.head .sub{margin-top:24px;font-size:clamp(21px,2.3vw,26px);line-height:1.6;color:var(--fg-2);max-width:32em}
.head .sub small{display:block;font-size:17px;margin-top:14px}
.ptags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ptags span{font-size:15.5px;font-weight:500;line-height:1.3;padding:6px 11px;border-radius:8px;background:var(--bg-2);color:var(--fg)}
.prof .sum{margin-top:10px}
.pnote{font-size:17px;line-height:1.6;margin-top:10px}
.who-links a{font-weight:500}
.prof .labn{margin:0 0 4px!important;font-size:17px;font-weight:500;margin-top:6px;line-height:1.5}
.prof .labn span{color:var(--fg-2);font-weight:400;margin-left:10px}
.plinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.plinks .go{font-size:16px;padding:10px 18px}
.due{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-top:36px;padding:18px 22px;background:var(--bg-2);border-radius:14px;color:var(--fg);max-width:var(--read)}
.due:hover{text-decoration:none}
.due strong{font-size:22px;font-weight:600;color:var(--warn)}
.due span{font-size:18px}
.due em{font-style:normal;color:var(--accent);font-size:17px;margin-left:auto}

/* ---------- tags: what kind of information ---------- */
.mk{display:inline-block;font:500 14px/1 var(--f);color:var(--fg-2);background:var(--bg-2);border-radius:6px;padding:6px 9px;white-space:nowrap;vertical-align:.15em}
.mk.gap{color:var(--warn)}

/* ---------- sections ---------- */
.sheet{padding-bottom:24px}
.sec{padding-block:clamp(48px,7vw,88px);border-top:1px solid var(--line)}
.sheet>.sec:first-child{border-top:0;padding-top:clamp(40px,6vw,64px)}
.sec>header{max-width:var(--read);margin-bottom:clamp(28px,4vw,44px)}
.sec>header h2{font-size:clamp(34px,4.4vw,52px);line-height:1.15;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.sec>header p{margin-top:14px;font-size:18px;line-height:1.65;color:var(--fg-2)}
.sec>header .mk{margin-top:16px}
.body{min-width:0}
.lead{font-size:clamp(24px,2.7vw,30px);line-height:1.6;font-weight:500;max-width:var(--read)}
.note{font-size:17px;line-height:1.65;color:var(--fg-2);max-width:var(--read)}

.areas{list-style:none;margin:20px 0 0;padding:0}
.areas li{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding:22px 0;border-top:1px solid var(--line)}
.areas .nm{font-weight:600;font-size:19px;line-height:1.45}
.areas .nm small{display:block;font-size:15px;color:var(--fg-2);font-weight:400;margin-top:2px}
.en-on .areas .nm small:not(.sc){display:none}
.areas .q{font-size:clamp(21px,2.2vw,24px);line-height:1.5;font-weight:500}
.areas .ex{font-size:17px;color:var(--fg-2);margin-top:6px}
.areas .lbl{color:var(--fg-2);font-weight:500;margin-right:10px}
.areas .also{margin-top:4px}
.areas .why{color:var(--fg-2)}
.grp{font-size:clamp(24px,2.6vw,28px);font-weight:600;line-height:1.3;margin:56px 0 0}
.gnote{font-size:17px;line-height:1.6;color:var(--fg-2);margin:8px 0 0;max-width:46em}
.wb{color:var(--warn);font-weight:600;font-size:15px;margin-left:6px}
.ptags.recent{margin-top:6px}
.ptags.recent span{background:transparent;border:1px solid var(--line);font-weight:400}
.ptags em{font-style:normal;font-size:15px;color:var(--fg-2);align-self:center;margin-right:2px}
.areas .theme .tag{display:block;font-size:14px;font-weight:600;color:var(--accent);margin-bottom:4px}
.layers{margin:10px 0 0;font-size:17px}
.layers div{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.layers div:first-child{border-top:0}
.layers dt{color:var(--fg-2);font-weight:500}
.layers dd{margin:0;color:var(--fg-2)}
.admit{font-size:16px;line-height:1.5;margin-top:10px;color:var(--fg-2)}
.admit.warn{color:var(--warn);font-weight:600}
.prof .ref{margin:16px 0 4px;padding:14px 18px;background:var(--bg-2);border-radius:10px;font-size:15px;line-height:1.65;color:var(--fg-2)}
.prof .ref .lbl{font-size:14px;font-weight:600;color:var(--fg-2);margin:0 0 4px}
.prof .ref ul{margin:0 0 10px;padding-left:1.1em}
.prof .ref ul:last-child{margin-bottom:0}
.prof .ref a{color:var(--accent)}
.prof .more{margin:0 0 14px}
.prof .src{margin:14px 0 4px}
.prof .src .lbl{font-size:15px;color:var(--fg-2);font-weight:500;margin:0 0 6px}
.prof .src ul{margin:0;padding-left:1.2em;font-size:15.5px;line-height:1.7}
.prof .src a{color:var(--accent)}
.prof .more .lbl{font-size:15px;color:var(--fg-2);font-weight:500;margin:0 0 6px}
.prof .more ul{margin:0;padding-left:1.2em;font-size:17px;line-height:1.6}


details.row{border-top:1px solid var(--line)}
details.row:last-of-type{border-bottom:1px solid var(--line)}
details.row>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 24px;gap:20px;align-items:start;padding:22px 0}
details.row>summary::-webkit-details-marker{display:none}
.pm{width:24px;height:24px;margin-top:6px;color:var(--fg-2)}
.pm path{stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;transition:transform .25s ease;transform-origin:12px 12px}
details .pm .v{transform:rotate(90deg)}
details[open]>summary .pm .v{transform:rotate(0deg)}
.rowin{padding:0 44px 28px 0}

.prof .who{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.prof .who b{font-size:clamp(24px,2.6vw,28px);font-weight:600}
.prof .who i,.prof .who em{font-style:normal;font-size:17px;color:var(--fg-2)}
.prof .sum{font-size:18px;line-height:1.6;margin-top:6px;color:var(--fg-2)}
.lines{margin:0 0 18px;padding-left:1.2em;display:grid;gap:6px}
.lines li{font-size:19px;line-height:1.5}
.lines li::marker{color:var(--fg-2)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 20px;font-size:17px;line-height:1.6;margin:0}
.kv dt{color:var(--fg-2)}
.kv dd{margin:0;min-width:0}

.mats{display:grid;gap:12px}
.mat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 28px;align-items:center;padding:24px 26px;background:var(--bg-2);border-radius:16px}
.mat h3{font-size:clamp(21px,2.2vw,24px);font-weight:600;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.mat p{font-size:17px;line-height:1.6;color:var(--fg-2);margin-top:8px;max-width:40em}
.go{display:inline-flex;align-items:center;gap:6px;font:500 17px/1.3 var(--f);color:#fff;background:var(--btn);border-radius:999px;padding:12px 20px;max-width:100%}
.go:hover{text-decoration:none;filter:brightness(1.08)}
.go svg{width:12px;height:12px;flex:none}
.go svg path{stroke:currentColor;stroke-width:2;fill:none}

.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rule{padding:26px 26px 28px;background:var(--bg-2);border-radius:16px;min-width:0}
.rule .big{font-size:clamp(52px,5.6vw,68px);line-height:1;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
.rule .big small{font-size:20px;font-weight:600;letter-spacing:0;white-space:nowrap}
.rule h3{font-size:21px;margin-top:14px;font-weight:600}
.rule p{font-size:16.5px;line-height:1.65;color:var(--fg-2);margin-top:8px}

.flow{overflow-x:auto}
.flow table{border-collapse:collapse;width:100%;min-width:660px;font-size:17px}
.flow th,.flow td{border-bottom:1px solid var(--line);padding:14px 12px;text-align:center;vertical-align:middle}
.flow thead th{font-weight:600;color:var(--fg-2);font-size:15px}
.flow tbody th{text-align:left;font-weight:600;white-space:nowrap;padding-left:0}
.flow td.on{font-weight:600;font-variant-numeric:tabular-nums}
.flow td.on::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px}
.flow td.opt::before{background:none;border:2px solid var(--accent)}
.flow td.span{font-size:16px;color:var(--fg-2);text-align:left}
.flow td.end{font-weight:600}

.seg{display:inline-flex;gap:2px;background:var(--bg-2);border-radius:999px;padding:4px;margin-bottom:28px;flex-wrap:wrap}
.seg button{font:500 16px/1.2 var(--f);background:none;border:0;color:var(--fg-2);padding:10px 18px;border-radius:999px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.map{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:12px}
.tier{padding:24px;background:var(--bg-2);border-radius:16px;min-width:0}
.tier h3{font-size:21px;font-weight:600}
.tier h3 span{display:none}
.tier h3 small{display:block;font-size:15px;font-weight:400;color:var(--fg-2);margin-top:2px}
.tier ul{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:0}
.tier li{font-size:17px;line-height:1.5;padding:7px 0;border-top:1px solid var(--line)}
.tier li small{display:none}
.tier.grad ul{grid-template-columns:1fr 1fr;column-gap:20px}
.mapnote{margin-top:18px}

.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:640px;font-size:17px}
.tbl th{font-weight:500;color:var(--fg-2);font-size:15px;text-align:left;padding:0 16px 12px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:16px 16px 16px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.tbl td.code{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--fg-2)}
.tbl td.cr,.tbl th.cr{text-align:right;padding-right:0}
.tbl td.cr{font-weight:600;font-variant-numeric:tabular-nums}
.tbl td b{font-weight:600;font-size:18px}
.tbl td small{display:block;font-size:14.5px;color:var(--fg-2)}

.base{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.base li{padding:24px 22px;background:var(--bg-2);border-radius:16px;font-size:clamp(20px,2.1vw,24px);font-weight:600;line-height:1.35;min-width:0}
h3.minor{font-size:26px;font-weight:600;margin:52px 0 8px}
.preptbl th[scope=row]{text-align:left;vertical-align:top;min-width:9em}
.preptbl th[scope=row] b{display:block;font-weight:600}
.preptbl th[scope=row] small{display:block;font-size:14px;color:var(--fg-2);font-weight:400;margin-top:2px}
.preptbl td{vertical-align:top}
.prep summary b{font-size:clamp(20px,2.1vw,23px);font-weight:600}
.prep summary small{font-size:15px;color:var(--fg-2);margin-left:10px}
.en-on .prep summary small{display:none}
.task{font-size:19px;line-height:1.65;padding:18px 22px;background:var(--bg-2);border-radius:14px;margin:0 0 18px}
.task b{display:block;font-size:15px;font-weight:600;color:var(--fg-2);margin-bottom:4px}

.xlinks{display:grid;gap:0}
.xlinks a{display:grid;grid-template-columns:48px minmax(0,1fr) 20px;gap:16px;align-items:center;padding:20px 0;border-top:1px solid var(--line);color:var(--fg)}
.xlinks a:last-child{border-bottom:1px solid var(--line)}
.xlinks a:hover{text-decoration:none;color:var(--accent)}
.xlinks .qn{font-size:28px;font-weight:600;color:var(--fg-2);font-variant-numeric:tabular-nums}
.xlinks .qt{font-size:clamp(19px,2vw,22px);font-weight:500;line-height:1.5}
.xlinks svg{width:18px;height:18px;color:var(--accent)}
.xlinks svg path{stroke:currentColor;stroke-width:2;fill:none}

.qa-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:8px}
.btn{font:500 16px/1.2 var(--f);background:var(--bg-2);border:0;color:var(--accent);padding:10px 18px;border-radius:999px;cursor:pointer;min-height:40px}
.btn:hover{filter:brightness(.97)}
.qcat{font-size:17px;font-weight:600;color:var(--fg-2);margin:48px 0 0;padding-bottom:12px}
.qcat:first-of-type{margin-top:28px}
details.qa{border-top:1px solid var(--line);scroll-margin-top:90px}
details.qa:last-of-type{border-bottom:1px solid var(--line)}
details.qa>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) 24px;gap:16px;align-items:start;padding:24px 0}
details.qa>summary::-webkit-details-marker{display:none}
details.qa .qn{font-size:30px;line-height:1.2;font-weight:600;color:var(--fg-2);font-variant-numeric:tabular-nums}
details.qa[open] .qn{color:var(--accent)}
details.qa .qq{font-size:clamp(22px,2.5vw,28px);font-weight:600;line-height:1.4}
details.qa .pm{margin-top:8px}
details.qa>summary:hover .qq{color:var(--accent)}
.ans{padding:0 40px 32px 72px;display:grid;gap:18px;max-width:calc(var(--read) + 112px)}
.ans p{font-size:clamp(19px,2vw,21px);line-height:1.85}
.en-on .ans p{line-height:1.7}

.adm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.adm>div{padding:26px;background:var(--bg-2);border-radius:16px;min-width:0}
.adm .big{font-size:clamp(48px,5vw,64px);line-height:1;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.adm .big small{font-size:20px;letter-spacing:0;margin-left:4px}
.adm p{font-size:17px;color:var(--fg-2);line-height:1.6;margin-top:10px}
.dates{list-style:none;margin:36px 0 0;padding:0}
.dates li{display:grid;grid-template-columns:190px 120px minmax(0,1fr);gap:20px;padding:20px 0;border-top:1px solid var(--line);align-items:baseline}
.dates li:last-child{border-bottom:1px solid var(--line)}
.dates .d{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.dates .d small{font-size:17px!important;font-weight:500;color:var(--fg-2)}
.dates .w{font-size:20px;line-height:1.5}
.dates .w small{display:block;font-size:16px;color:var(--fg-2);margin-top:2px}
.dates .left{font-size:16px;font-weight:600;color:var(--warn);white-space:nowrap}
.dates .left.past{color:var(--fg-2)}
.docs{margin:14px 0 0;padding-left:1.4em;font-size:19px;line-height:1.8}
.docs li::marker{color:var(--fg-2)}

.band{margin-top:clamp(40px,6vw,64px);padding:28px 30px;background:var(--bg-2);border-radius:18px}
.band h2{font-size:17px;font-weight:600;margin-bottom:14px}
.band ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 36px}
.band li{font-size:16px;line-height:1.5;color:var(--fg-2);min-width:0}
.band li a,.band li strong{font-weight:500;color:var(--accent)}
.band li strong{color:var(--fg)}
.band li span{display:block;font-size:14.5px;font-variant-numeric:tabular-nums;margin-top:2px}

footer.foot{border-top:1px solid var(--line);margin-top:48px}
footer.foot .wrap{padding-block:40px 64px}
footer.foot h2{font-size:21px;font-weight:600}
footer.foot ul{margin:14px 0 0;padding-left:1.2em;font-size:17px;line-height:1.8;color:var(--fg-2);columns:2;column-gap:40px}
footer.foot p{font-size:15px;color:var(--fg-2);margin-top:20px;line-height:1.6;max-width:var(--read)}

@media (max-width:980px){
  .rules,.adm{grid-template-columns:1fr 1fr}
  .map{grid-template-columns:1fr 1fr}
  .tier.grad{grid-column:1/-1}
  .base{grid-template-columns:1fr 1fr}
  .tabs{gap:20px}
}
@media (max-width:760px){
  body{font-size:19px}
  .bar .wrap{flex-wrap:wrap;gap:0 16px;min-height:0;padding-top:10px}
  .brand{font-size:18px}
  .tabs{order:3;width:100%;gap:22px;overflow-x:auto;scrollbar-width:none;margin-top:4px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:10px 0 11px;font-size:17px}
  .head{padding-block:44px 36px}
  .areas li{grid-template-columns:1fr;gap:6px}
    .rules,.adm{grid-template-columns:1fr}
  .map{grid-template-columns:1fr}
  .tier.grad ul{grid-template-columns:1fr}
  .rowin{padding-right:0}
  details.qa>summary{grid-template-columns:40px minmax(0,1fr) 24px;gap:12px}
  details.qa .qn{font-size:26px}
  .ans{padding:0 0 28px 0}
  .kv{grid-template-columns:1fr;gap:0}
  .kv dd{margin-bottom:12px}
  .dates li{grid-template-columns:1fr auto;gap:4px 16px}
  .dates .w{grid-column:1/-1}
  .band{padding:22px 20px}
  .band ul{grid-template-columns:1fr}
  footer.foot ul{columns:1}
  .mat{grid-template-columns:1fr;padding:22px 20px}

    cats.map(function(c){return '<h3 class="qcat">'+esc(x(c))+'</h3>'+by[c.zh].map(function(q){

    '<div><div class="big">80<small>／</small>95</div><p>'+zhen("審查 80 分以上可參加口試；95 分以上優先錄取、免口試","Review ≥80 qualifies for interview; ≥95 means priority admission without interview")+'</p></div></div>'+
    '<ul class="dates">'+DATES.map(function(d){var n=daysTo(d.d);return '<li><span class="d">'+d.d.slice(5).replace("-","/")+(d.d2?'–'+d.d2.slice(3):'')+(d.tm?' <small style="font-size:15px">'+d.tm+'</small>':'')+'</span><span class="left'+(n<0?' past':'')+'">'+T.left(n)+'</span><span class="w">'+d.w[L==="zh"?0:1]+'<small>'+d.s[L==="zh"?0:1]+'</small></span></li>';}).join("")+'</ul>'+
    '<h3 class="minor" style="margin-top:32px">'+zhen("必繳文件","Required documents")+'</h3><ol class="docs">'+DOCS.map(function(d){return '<li>'+d[L==="zh"?0:1]+'</li>';}).join("")+'</ol>'+
    '<p class="note" style="margin-top:10px">'+zhen("選繳：推薦函至多一封（由推薦人上傳）；其他有利審查資料合成一份 PDF。逾期不補件。","Optional: at most one recommendation letter (uploaded by the recommender); other supporting material combined into one PDF. Late documents are not accepted.")+'</p>'+

var io=("IntersectionObserver" in window)?new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});},{threshold:.25}):null;
function watchNext(){[].forEach.call(document.querySelectorAll(".nextup:not(.in)"),function(n){if(io)io.observe(n);else n.classList.add("in");});}
function show(id,anim){
  cur=id;
  ["intro","courses","qa"].forEach(function(k){document.getElementById("s-"+k).hidden=(k!==id);});
  renderTabs();
  var s=document.getElementById("s-"+id);
  if(anim){s.classList.remove("enter");void s.offsetWidth;s.classList.add("enter");}
  watchNext();
}
function route(anim){
  var h=(location.hash||"").slice(1);
  var target=null,sheet="intro";
  if(/^q\d+$/.test(h)){sheet="qa";target=h;}
  else if(h==="adm"||h==="qa-list"){sheet="qa";target=h;}
  else if(["intro","courses","qa"].indexOf(h)>=0){sheet=h;}
  else if(document.getElementById(h)){var el=document.getElementById(h);var p=el.closest(".sheet");if(p)sheet=p.id.slice(2);target=h;}
  show(sheet,anim && sheet!==cur);
  if(target){var el2=document.getElementById(target);if(el2){if(el2.tagName==="DETAILS")el2.open=true;var go=function(){var tb=document.querySelector(".bar").getBoundingClientRect().height;window.scrollTo({top:el2.getBoundingClientRect().top+window.scrollY-tb-12,behavior:"instant"});};requestAnimationFrame(go);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){requestAnimationFrame(go);});}}
  else if(anim){var mn=document.querySelector("main");var bh=document.querySelector(".bar").getBoundingClientRect().height;var y=mn.getBoundingClientRect().top+window.scrollY-bh;window.scrollTo({top:y,behavior:"instant"});}
}
function setLang(l){
  if(l===L)return; L=l;
  try{localStorage.setItem("gice-lang",L);}catch(e){}
  var open=[].map.call(document.querySelectorAll("details[open]"),function(d){return d.id;}).filter(Boolean);
  renderStatic();renderSheets();show(cur,false);
  open.forEach(function(id){var d=document.getElementById(id);if(d)d.open=true;});
}
document.addEventListener("click",function(e){
  var nu=e.target.closest("[data-next]");
  if(nu){e.preventDefault();var to=nu.getAttribute("data-next");var curS=document.getElementById("s-"+cur);
    var rm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(rm){location.hash=to;return;}
    curS.classList.add("leave");setTimeout(function(){curS.classList.remove("leave");location.hash=to;},260);return;}
  var b=e.target.closest("[data-lang]");if(b){setLang(b.getAttribute("data-lang"));return;}
  var m=e.target.closest("[data-map]");if(m){mapSel=m.getAttribute("data-map");
    [].forEach.call(document.querySelectorAll("[data-map]"),function(x){x.setAttribute("aria-pressed",x.getAttribute("data-map")===mapSel);});
    document.getElementById("mapbox").innerHTML=tierBlock(D[mapSel])+mapNote();return;}
  if(e.target.closest("#all")){var ds=document.querySelectorAll("details.qa");var any=[].some.call(ds,function(d){return !d.open;});
    [].forEach.call(ds,function(d){d.open=any;});e.target.closest("#all").textContent=any?zhen("全部收合","Collapse all"):zhen("全部展開","Expand all");return;}
});

renderStatic();renderSheets();route(false);
})();
